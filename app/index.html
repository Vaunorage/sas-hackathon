<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACFC Algorithm API Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Courier New", Courier, monospace;
            background: #c0c0c0;
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: #ffffff;
            padding: 20px;
            border: 3px ridge #808080;
            margin-bottom: 10px;
        }

        h1 {
            color: #000080;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border: 2px solid #000000;
            font-size: 12px;
            font-weight: bold;
        }

        .status-healthy {
            background: #00ff00;
            color: #000000;
        }

        .status-failed {
            background: #ff0000;
            color: #ffffff;
        }

        .card {
            background: #ffffff;
            padding: 20px;
            border: 3px ridge #808080;
            margin-bottom: 10px;
        }

        h2 {
            color: #000080;
            margin-bottom: 15px;
            font-size: 18px;
        }

        h3 {
            color: #000000;
            font-size: 14px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 12px;
            font-weight: bold;
            color: #000000;
            margin-bottom: 3px;
        }

        input {
            padding: 4px;
            border: 2px inset #808080;
            font-size: 12px;
            font-family: "Courier New", Courier, monospace;
            background: #ffffff;
        }

        input:focus {
            outline: 2px solid #000080;
        }

        button {
            background: #c0c0c0;
            color: #000000;
            border: 2px outset #ffffff;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            font-family: "Courier New", Courier, monospace;
        }

        button:hover {
            background: #d0d0d0;
        }

        button:active {
            border: 2px inset #808080;
        }

        button:disabled {
            color: #808080;
            cursor: not-allowed;
        }

        .jobs-list {
            max-height: 500px;
            overflow-y: auto;
            border: 2px inset #808080;
            background: #ffffff;
            padding: 10px;
        }

        .job-item {
            background: #ffffff;
            padding: 10px;
            border: 2px solid #000000;
            margin-bottom: 10px;
        }

        .job-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            border-bottom: 1px solid #000000;
            padding-bottom: 5px;
        }

        .job-id {
            font-weight: bold;
            color: #000000;
        }

        .job-status {
            padding: 2px 8px;
            border: 2px solid #000000;
            font-size: 11px;
            font-weight: bold;
        }

        .status-pending {
            background: #ffff00;
            color: #000000;
        }

        .status-running {
            background: #00ffff;
            color: #000000;
        }

        .status-completed {
            background: #00ff00;
            color: #000000;
        }

        .job-info {
            font-size: 11px;
            color: #000000;
            line-height: 1.6;
        }

        .job-actions {
            margin-top: 8px;
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .btn-small {
            padding: 4px 8px;
            font-size: 11px;
        }

        .results-container {
            background: #ffffff;
            padding: 10px;
            border: 2px inset #808080;
            margin-top: 10px;
            max-height: 400px;
            overflow: auto;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid #000000;
        }

        .download-btn {
            padding: 4px 8px;
            font-size: 11px;
            background: #008000;
            color: #ffffff;
            border: 2px outset #008000;
            cursor: pointer;
        }

        .download-btn:hover {
            background: #00a000;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            background: #ffffff;
            border: 2px solid #000000;
        }

        th {
            background: #000080;
            color: #ffffff;
            padding: 6px;
            text-align: left;
            border: 1px solid #000000;
            position: sticky;
            top: 0;
            font-weight: bold;
        }

        td {
            padding: 4px 6px;
            border: 1px solid #808080;
        }

        tr:nth-child(even) {
            background: #e0e0e0;
        }

        .table-container {
            max-height: 350px;
            overflow: auto;
            border: 2px inset #808080;
        }

        pre {
            font-size: 11px;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: "Courier New", Courier, monospace;
        }

        .alert {
            padding: 10px;
            border: 2px solid #000000;
            margin-bottom: 10px;
        }

        .alert-success {
            background: #00ff00;
            color: #000000;
        }

        .alert-error {
            background: #ff0000;
            color: #ffffff;
        }

        .alert-info {
            background: #ffff00;
            color: #000000;
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: #808080;
            font-style: italic;
        }

        .api-url {
            background: #ffffff;
            padding: 5px;
            border: 2px inset #808080;
            font-family: "Courier New", Courier, monospace;
            font-size: 11px;
            margin-top: 5px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: #c0c0c0;
            border: 3px ridge #ffffff;
            max-width: 95vw;
            max-height: 90vh;
            width: 1200px;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            padding: 10px 15px;
            background: #000080;
            color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #000000;
        }

        .modal-header h3 {
            margin: 0;
            color: #ffffff;
            font-size: 16px;
        }

        .modal-close {
            background: #c0c0c0;
            color: #000000;
            border: 2px outset #ffffff;
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
            font-weight: bold;
        }

        .modal-close:hover {
            background: #d0d0d0;
        }

        .modal-close:active {
            border: 2px inset #808080;
        }

        .modal-body {
            padding: 15px;
            overflow-y: auto;
            flex: 1;
            background: #ffffff;
        }

        .modal .table-container {
            max-height: calc(90vh - 180px);
        }

        .modal-actions {
            padding: 10px 15px;
            background: #c0c0c0;
            border-top: 2px solid #000000;
            display: flex;
            justify-content: flex-end;
            gap: 5px;
        }

        input[type="file"] {
            background: #ffffff;
            border: 2px inset #808080;
            padding: 2px;
            font-family: "Courier New", Courier, monospace;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>*** ACFC Algorithm API Dashboard ***</h1>
            <p style="color: #000000; margin-top: 5px;">
                API Status: <span id="apiStatus" class="status-badge">Checking...</span>
            </p>
            <div class="form-group" style="margin-top: 10px;">
                <label for="apiToken">API Token</label>
                <input type="password" id="apiToken" name="apiToken" style="width: 100%;" placeholder="Enter your API token">
            </div>
        </div>

        <div id="alertContainer"></div>

        <div class="card">
            <h2>[ Create New Job ]</h2>
            <form id="jobForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="nb_accounts">Number of Accounts</label>
                        <input type="number" id="nb_accounts" name="nb_accounts" value="4" min="1">
                    </div>
                    <div class="form-group">
                        <label for="nb_scenarios">Number of Scenarios</label>
                        <input type="number" id="nb_scenarios" name="nb_scenarios" value="10" min="1">
                    </div>
                    <div class="form-group">
                        <label for="nb_years">Number of Years</label>
                        <input type="number" id="nb_years" name="nb_years" value="10" min="1">
                    </div>
                    <div class="form-group">
                        <label for="nb_sc_int">Scenarios Internal</label>
                        <input type="number" id="nb_sc_int" name="nb_sc_int" value="10" min="1">
                    </div>
                    <div class="form-group">
                        <label for="nb_an_projection_int">Projection Years Internal</label>
                        <input type="number" id="nb_an_projection_int" name="nb_an_projection_int" value="10" min="1">
                    </div>
                    <div class="form-group">
                        <label for="choc_capital">Capital Shock</label>
                        <input type="number" id="choc_capital" name="choc_capital" value="0.35" step="0.01">
                    </div>
                    <div class="form-group">
                        <label for="hurdle_rt">Hurdle Rate</label>
                        <input type="number" id="hurdle_rt" name="hurdle_rt" value="0.10" step="0.01">
                    </div>
                </div>

                <h3 style="margin: 15px 0 10px 0; color: #000000; font-size: 14px;">[ Logging Parameters - Optional ]</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="log_account_id">Log Account ID</label>
                        <input type="number" id="log_account_id" name="log_account_id" placeholder="Leave empty for none" min="0">
                    </div>
                    <div class="form-group">
                        <label for="log_scenario">Log Scenario</label>
                        <input type="number" id="log_scenario" name="log_scenario" placeholder="Leave empty for none" min="0">
                    </div>
                    <div class="form-group">
                        <label for="log_max_years">Log Max Years</label>
                        <input type="number" id="log_max_years" name="log_max_years" placeholder="Leave empty for none" min="0">
                    </div>
                    <div class="form-group">
                        <label for="log_internal_scenario">Log Internal Scenario</label>
                        <input type="number" id="log_internal_scenario" name="log_internal_scenario" placeholder="Leave empty for none" min="0">
                    </div>
                </div>

                <h3 style="margin: 15px 0 10px 0; color: #000000; font-size: 14px;">[ Optional Custom Data Files ]</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="population">Population File</label>
                        <input type="file" id="population" name="population" accept=".csv">
                    </div>
                    <div class="form-group">
                        <label for="rendement">Rendement File</label>
                        <input type="file" id="rendement" name="rendement" accept=".csv">
                    </div>
                    <div class="form-group">
                        <label for="tx_deces">Tx Deces File</label>
                        <input type="file" id="tx_deces" name="tx_deces" accept=".csv">
                    </div>
                    <div class="form-group">
                        <label for="tx_interet">Tx Interet File</label>
                        <input type="file" id="tx_interet" name="tx_interet" accept=".csv">
                    </div>
                    <div class="form-group">
                        <label for="tx_interet_int">Tx Interet Int File</label>
                        <input type="file" id="tx_interet_int" name="tx_interet_int" accept=".csv">
                    </div>
                    <div class="form-group">
                        <label for="tx_retrait">Tx Retrait File</label>
                        <input type="file" id="tx_retrait" name="tx_retrait" accept=".csv">
                    </div>
                </div>

                <button type="submit" id="submitBtn">Create Job</button>
            </form>
        </div>

        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2 style="margin: 0;">[ Jobs List ]</h2>
                <button onclick="refreshJobs()" class="btn-small">Refresh</button>
            </div>
            <div id="jobsList" class="jobs-list">
                <div class="empty-state">Loading jobs...</div>
            </div>
        </div>
    </div>

    <div id="resultsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Results</h3>
                <button class="modal-close" onclick="closeModal('resultsModal')">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <div class="empty-state">Loading...</div>
            </div>
            <div class="modal-actions">
                <button class="download-btn" id="modalDownloadBtn" style="display: none;">Download CSV</button>
                <button onclick="closeModal('resultsModal')" class="btn-small">Close</button>
            </div>
        </div>
    </div>

    <div id="filesModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="filesModalTitle">Job Files</h3>
                <button class="modal-close" onclick="closeModal('filesModal')">&times;</button>
            </div>
            <div class="modal-body" id="filesModalBody">
                <!-- File content will be loaded here -->
            </div>
            <div class="modal-actions">
                <button onclick="closeModal('filesModal')" class="btn-small">Close</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://dmbnzrujidzodv.api.runpod.ai';

        function showAlert(message, type = 'info') {
            const alertContainer = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            alertContainer.appendChild(alert);

            setTimeout(() => {
                alert.remove();
            }, 5000);
        }

        function getHeaders() {
            const headers = {
                'accept': 'application/json',
            };
            const apiToken = document.getElementById('apiToken').value;
            if (apiToken) {
                headers['authorization'] = `${apiToken}`;
            }
            return headers;
        }

        async function checkApiStatus() {
            try {
                const response = await fetch(`${API_BASE}/ping`, { headers: getHeaders() });
                const data = await response.json();
                const statusEl = document.getElementById('apiStatus');
                if (data.status === 'healthy') {
                    statusEl.textContent = 'Healthy';
                    statusEl.className = 'status-badge status-healthy';
                } else {
                    statusEl.textContent = 'Offline';
                    statusEl.className = 'status-badge status-failed';
                }
            } catch (error) {
                const statusEl = document.getElementById('apiStatus');
                statusEl.textContent = 'Offline';
                statusEl.className = 'status-badge status-failed';
            }
        }

        document.getElementById('jobForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating...';

            const formData = new FormData(e.target);
            const json_input = {};
            const parameters = {};

            for (const [key, value] of formData.entries()) {
                if (value !== '' && value !== null) {
                    if (key.startsWith('log_')) {
                        if (!parameters.logging_params) parameters.logging_params = {};
                        parameters.logging_params[key] = isNaN(Number(value)) ? value : Number(value);
                    } else if (['population', 'rendement', 'tx_deces', 'tx_interet', 'tx_interet_int', 'tx_retrait'].includes(key) && value.size > 0) {
                        // Files will be handled separately
                    } else if (!['population', 'rendement', 'tx_deces', 'tx_interet', 'tx_interet_int', 'tx_retrait'].includes(key)) {
                        parameters[key] = isNaN(Number(value)) ? value : Number(value);
                    }
                }
            }
            json_input.parameters = parameters;

            const files = {};
            const fileInputIds = ['population', 'rendement', 'tx_deces', 'tx_interet', 'tx_interet_int', 'tx_retrait'];
            const fileReadPromises = fileInputIds.map(id => {
                const fileInput = document.getElementById(id);
                if (fileInput.files.length > 0) {
                    return new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            files[id] = event.target.result;
                            resolve();
                        };
                        reader.onerror = reject;
                        reader.readAsText(fileInput.files[0]);
                    });
                }
                return Promise.resolve();
            });

            try {
                await Promise.all(fileReadPromises);
                if (Object.keys(files).length > 0) {
                    json_input.files = files;
                }

                const headers = getHeaders();
                headers['content-type'] = 'application/json';

                const response = await fetch(`${API_BASE}/runsync`, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({ input: json_input })
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert(`Job created successfully: ${data.job_id}`, 'success');
                    refreshJobs();
                    e.target.reset();
                } else {
                    showAlert(`Error: ${data.error}`, 'error');
                }
            } catch (error) {
                showAlert(`Failed to create job: ${error.message}`, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Job';
            }
        });

        async function refreshJobs() {
            try {
                const response = await fetch(`${API_BASE}/jobs`, { headers: getHeaders() });
                const data = await response.json();

                const jobsList = document.getElementById('jobsList');

                if (data.jobs && data.jobs.length > 0) {
                    jobsList.innerHTML = data.jobs.map(job => {
                        return `
                        <div class="job-item">
                            <div class="job-header">
                                <span class="job-id">${job.job_id}</span>
                                <span class="job-status status-${job.status}">${job.status.toUpperCase()}</span>
                            </div>
                            <div class="job-info">
                                <div>Created: ${new Date(job.created_at).toLocaleString()}</div>
                                ${job.started_at ? `<div>Started: ${new Date(job.started_at).toLocaleString()}</div>` : ''}
                                ${job.completed_at ? `<div>Completed: ${new Date(job.completed_at).toLocaleString()}</div>` : ''}
                                ${job.error ? `<div style="color: #ff0000;">Error: ${job.error}</div>` : ''}
                            </div>
                            <div class="job-actions">
                                <button class="btn-small" onclick="viewJobDetails('${job.job_id}')">View Details</button>
                                ${job.status === 'completed' ? `
                                    <button class="btn-small" onclick="viewResults('${job.job_id}', 'summary')">Summary Results</button>
                                    <button class="btn-small" onclick="viewResults('${job.job_id}', 'detailed')">Detailed Results</button>
                                    <button class="btn-small" onclick="viewResults('${job.job_id}', 'internal')">Internal Results</button>
                                ` : ''}
                                <button class="btn-small" onclick="viewFiles('${job.job_id}')">View Input Files</button>
                            </div>
                        </div>
                    `}).join('');
                } else {
                    jobsList.innerHTML = '<div class="empty-state">No jobs found. Create one to get started.</div>';
                }
            } catch (error) {
                const jobsList = document.getElementById('jobsList');
                jobsList.innerHTML = '<div class="alert alert-error">Failed to load jobs. API might be offline.</div>';
            }
        }

        async function viewJobDetails(jobId) {
            try {
                const response = await fetch(`${API_BASE}/jobs/${jobId}`, { headers: getHeaders() });
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to fetch job details.');
                }

                const modalTitle = document.getElementById('modalTitle');
                const modalBody = document.getElementById('modalBody');

                modalTitle.textContent = `Details for Job: ${jobId}`;
                let paramsHtml = '<h3>Parameters</h3><pre>' + JSON.stringify(data.parameters, null, 2) + '</pre>';
                modalBody.innerHTML = paramsHtml;
                openModal('resultsModal');

            } catch (error) {
                showAlert(error.message, 'error');
            }
        }

        async function viewResults(jobId, type) {
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');
            const downloadBtn = document.getElementById('modalDownloadBtn');

            modalTitle.textContent = `Results for Job: ${jobId} - ${type}`;
            modalBody.innerHTML = '<div class="empty-state">Loading...</div>';
            downloadBtn.style.display = 'none';

            openModal('resultsModal');

            try {
                const response = await fetch(`${API_BASE}/jobs/${jobId}/results?type=${type}`, { headers: getHeaders() });
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to fetch results.');
                }

                if (Array.isArray(data) && data.length > 0) {
                    const headers = Object.keys(data[0]);
                    const tableRows = data.map(row => `<tr>${headers.map(h => `<td>${row[h]}</td>`).join('')}</tr>`).join('');

                    modalBody.innerHTML = `
                        <div class="table-container">
                            <table>
                                <thead>
                                    <tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr>
                                </thead>
                                <tbody>${tableRows}</tbody>
                            </table>
                        </div>
                    `;

                    downloadBtn.style.display = 'inline-block';
                    downloadBtn.onclick = () => downloadCSV(data, `${jobId}_${type}_results.csv`);
                } else {
                    modalBody.innerHTML = '<div class="empty-state">No results data found.</div>';
                }
            } catch (error) {
                modalBody.innerHTML = `<div class="alert alert-error">${error.message}</div>`;
            }
        }

        async function viewFiles(jobId) {
            const modalTitle = document.getElementById('filesModalTitle');
            const modalBody = document.getElementById('filesModalBody');

            modalTitle.textContent = `Input Files for Job: ${jobId}`;
            modalBody.innerHTML = '<div class="empty-state">Loading file list...</div>';
            openModal('filesModal');

            try {
                const response = await fetch(`${API_BASE}/jobs/${jobId}/files`, { headers: getHeaders() });
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to load file list.');
                }

                if (data.files && data.files.length > 0) {
                    modalBody.innerHTML = `
                        <div style="margin-bottom: 10px;">Select a file to view its content:</div>
                        <div id="fileButtonContainer" style="display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 15px;">
                            ${data.files.map(file => `<button class="btn-small" onclick="viewFileContent('${jobId}', '${file}')">${file}</button>`).join('')}
                        </div>
                        <div id="fileContentContainer"></div>
                    `;
                } else {
                    modalBody.innerHTML = '<div class="empty-state">No custom input files were uploaded for this job.</div>';
                }
            } catch (error) {
                modalBody.innerHTML = `<div class="alert alert-error">${error.message}</div>`;
            }
        }

        async function viewFileContent(jobId, fileName) {
            const container = document.getElementById('fileContentContainer');
            if (!container) return;

            container.innerHTML = '<div class="empty-state">Loading file content...</div>';

            try {
                const response = await fetch(`${API_BASE}/jobs/${jobId}/files/${fileName}`, { headers: getHeaders() });
                const csvText = await response.text();

                if (!response.ok) {
                    const errorJson = JSON.parse(csvText);
                    throw new Error(errorJson.error || `Failed to load ${fileName}.`);
                }

                const rows = csvText.trim().split('\n');
                const headers = rows[0].split(',');
                const tableRows = rows.slice(1).map(row => {
                    const values = row.split(',');
                    return `<tr>${values.map(val => `<td>${val}</td>`).join('')}</tr>`;
                }).join('');

                container.innerHTML = `
                    <h3 style="margin-bottom: 10px;">${fileName}</h3>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr>
                            </thead>
                            <tbody>
                                ${tableRows}
                            </tbody>
                        </table>
                    </div>
                `;
            } catch (error) {
                container.innerHTML = `<div class="alert alert-error">${error.message}</div>`;
            }
        }

        function downloadCSV(data, filename) {
            const csvRows = [];
            const headers = Object.keys(data[0]);
            csvRows.push(headers.join(','));

            for (const row of data) {
                const values = headers.map(header => {
                    const escaped = ('' + row[header]).replace(/"/g, '\\"');
                    return `"${escaped}"`;
                });
                csvRows.push(values.join(','));
            }

            const blob = new Blob([csvRows.join('\n')], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('hidden', '');
            a.setAttribute('href', url);
            a.setAttribute('download', filename);
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function openModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) modal.classList.add('active');
        }

        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) modal.classList.remove('active');
        }

        window.addEventListener('click', (event) => {
            if (event.target.classList.contains('modal')) {
                closeModal(event.target.id);
            }
        });

        window.onload = () => {
            checkApiStatus();
            refreshJobs();
            setInterval(refreshJobs, 15000);
        };
    </script>
</body>
</html>

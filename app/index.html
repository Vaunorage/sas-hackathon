<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACFC Algorithm API Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Courier New", Courier, monospace;
            background: #c0c0c0;
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: #ffffff;
            padding: 20px;
            border: 3px ridge #808080;
            margin-bottom: 10px;
        }

        h1 {
            color: #000080;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border: 2px solid #000000;
            font-size: 12px;
            font-weight: bold;
        }

        .status-healthy {
            background: #00ff00;
            color: #000000;
        }

        .status-failed {
            background: #ff0000;
            color: #ffffff;
        }

        .card {
            background: #ffffff;
            padding: 20px;
            border: 3px ridge #808080;
            margin-bottom: 10px;
        }

        h2 {
            color: #000080;
            margin-bottom: 15px;
            font-size: 18px;
        }

        h3 {
            color: #000000;
            font-size: 14px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 12px;
            font-weight: bold;
            color: #000000;
            margin-bottom: 3px;
        }

        input {
            padding: 4px;
            border: 2px inset #808080;
            font-size: 12px;
            font-family: "Courier New", Courier, monospace;
            background: #ffffff;
        }

        input:focus {
            outline: 2px solid #000080;
        }

        button {
            background: #c0c0c0;
            color: #000000;
            border: 2px outset #ffffff;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            font-family: "Courier New", Courier, monospace;
        }

        button:hover {
            background: #d0d0d0;
        }

        button:active {
            border: 2px inset #808080;
        }

        button:disabled {
            color: #808080;
            cursor: not-allowed;
        }

        .jobs-list {
            max-height: 500px;
            overflow-y: auto;
            border: 2px inset #808080;
            background: #ffffff;
            padding: 10px;
        }

        .job-item {
            background: #ffffff;
            padding: 10px;
            border: 2px solid #000000;
            margin-bottom: 10px;
        }

        .job-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            border-bottom: 1px solid #000000;
            padding-bottom: 5px;
        }

        .job-id {
            font-weight: bold;
            color: #000000;
        }

        .job-status {
            padding: 2px 8px;
            border: 2px solid #000000;
            font-size: 11px;
            font-weight: bold;
        }

        .status-pending {
            background: #ffff00;
            color: #000000;
        }

        .status-running {
            background: #00ffff;
            color: #000000;
        }

        .status-completed {
            background: #00ff00;
            color: #000000;
        }

        .job-info {
            font-size: 11px;
            color: #000000;
            line-height: 1.6;
        }

        .job-actions {
            margin-top: 8px;
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .btn-small {
            padding: 4px 8px;
            font-size: 11px;
        }

        .results-container {
            background: #ffffff;
            padding: 10px;
            border: 2px inset #808080;
            margin-top: 10px;
            max-height: 400px;
            overflow: auto;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid #000000;
        }

        .download-btn {
            padding: 4px 8px;
            font-size: 11px;
            background: #008000;
            color: #ffffff;
            border: 2px outset #008000;
            cursor: pointer;
        }

        .download-btn:hover {
            background: #00a000;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            background: #ffffff;
            border: 2px solid #000000;
        }

        th {
            background: #000080;
            color: #ffffff;
            padding: 6px;
            text-align: left;
            border: 1px solid #000000;
            position: sticky;
            top: 0;
            font-weight: bold;
        }

        td {
            padding: 4px 6px;
            border: 1px solid #808080;
        }

        tr:nth-child(even) {
            background: #e0e0e0;
        }

        .table-container {
            max-height: 350px;
            overflow: auto;
            border: 2px inset #808080;
        }

        pre {
            font-size: 11px;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: "Courier New", Courier, monospace;
        }

        .alert {
            padding: 10px;
            border: 2px solid #000000;
            margin-bottom: 10px;
        }

        .alert-success {
            background: #00ff00;
            color: #000000;
        }

        .alert-error {
            background: #ff0000;
            color: #ffffff;
        }

        .alert-info {
            background: #ffff00;
            color: #000000;
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: #808080;
            font-style: italic;
        }

        .api-url {
            background: #ffffff;
            padding: 5px;
            border: 2px inset #808080;
            font-family: "Courier New", Courier, monospace;
            font-size: 11px;
            margin-top: 5px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: #c0c0c0;
            border: 3px ridge #ffffff;
            max-width: 95vw;
            max-height: 90vh;
            width: 1200px;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            padding: 10px 15px;
            background: #000080;
            color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #000000;
        }

        .modal-header h3 {
            margin: 0;
            color: #ffffff;
            font-size: 16px;
        }

        .modal-close {
            background: #c0c0c0;
            color: #000000;
            border: 2px outset #ffffff;
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
            font-weight: bold;
        }

        .modal-close:hover {
            background: #d0d0d0;
        }

        .modal-close:active {
            border: 2px inset #808080;
        }

        .modal-body {
            padding: 15px;
            overflow-y: auto;
            flex: 1;
            background: #ffffff;
        }

        .modal .table-container {
            max-height: calc(90vh - 180px);
        }

        .modal-actions {
            padding: 10px 15px;
            background: #c0c0c0;
            border-top: 2px solid #000000;
            display: flex;
            justify-content: flex-end;
            gap: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>*** ACFC Algorithm API Dashboard ***</h1>
            <p style="color: #000000; margin-top: 5px;">
                API Status: <span id="apiStatus" class="status-badge">Checking...</span>
            </p>
            <div class="api-url">API Endpoint: <span id="apiEndpoint">http://localhost:80</span></div>
        </div>

        <div id="alertContainer"></div>

        <div class="card">
            <h2>[ Create New Job ]</h2>
            <form id="jobForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Number of Accounts</label>
                        <input type="number" id="nb_accounts" value="4" min="1">
                    </div>
                    <div class="form-group">
                        <label>Number of Scenarios</label>
                        <input type="number" id="nb_scenarios" value="10" min="1">
                    </div>
                    <div class="form-group">
                        <label>Number of Years</label>
                        <input type="number" id="nb_years" value="10" min="1">
                    </div>
                    <div class="form-group">
                        <label>Scenarios Internal</label>
                        <input type="number" id="nb_sc_int" value="10" min="1">
                    </div>
                    <div class="form-group">
                        <label>Projection Years Internal</label>
                        <input type="number" id="nb_an_projection_int" value="10" min="1">
                    </div>
                    <div class="form-group">
                        <label>Capital Shock</label>
                        <input type="number" id="choc_capital" value="0.35" step="0.01">
                    </div>
                    <div class="form-group">
                        <label>Hurdle Rate</label>
                        <input type="number" id="hurdle_rt" value="0.10" step="0.01">
                    </div>
                </div>

                <h3 style="margin: 15px 0 10px 0; color: #000000; font-size: 14px;">[ Logging Parameters - Optional ]</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Log Account ID</label>
                        <input type="number" id="log_account_id" placeholder="Leave empty for none" min="0">
                    </div>
                    <div class="form-group">
                        <label>Log Scenario</label>
                        <input type="number" id="log_scenario" placeholder="Leave empty for none" min="0">
                    </div>
                    <div class="form-group">
                        <label>Log Max Years</label>
                        <input type="number" id="log_max_years" placeholder="Leave empty for none" min="0">
                    </div>
                    <div class="form-group">
                        <label>Log Internal Scenario</label>
                        <input type="number" id="log_internal_scenario" placeholder="Leave empty for none" min="0">
                    </div>
                </div>

                <button type="submit" id="submitBtn">Create Job</button>
            </form>
        </div>

        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2 style="margin: 0;">[ Jobs List ]</h2>
                <button onclick="refreshJobs()" class="btn-small">Refresh</button>
            </div>
            <div id="jobsList" class="jobs-list">
                <div class="empty-state">Loading jobs...</div>
            </div>
        </div>
    </div>

    <div id="resultsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Results</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <div class="empty-state">Loading...</div>
            </div>
            <div class="modal-actions">
                <button class="download-btn" id="modalDownloadBtn" style="display: none;">Download CSV</button>
                <button onclick="closeModal()" class="btn-small">Close</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://12fkbziz4ylzxx-80.proxy.runpod.net';

        document.getElementById('apiEndpoint').textContent = API_BASE;

        function showAlert(message, type = 'info') {
            const alertContainer = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            alertContainer.appendChild(alert);

            setTimeout(() => {
                alert.remove();
            }, 5000);
        }

        async function checkApiStatus() {
            try {
                const response = await fetch(`${API_BASE}/ping`);
                const data = await response.json();
                const statusEl = document.getElementById('apiStatus');
                if (data.status === 'healthy') {
                    statusEl.textContent = 'Healthy';
                    statusEl.className = 'status-badge status-healthy';
                }
            } catch (error) {
                const statusEl = document.getElementById('apiStatus');
                statusEl.textContent = 'Offline';
                statusEl.className = 'status-badge status-failed';
            }
        }

        document.getElementById('jobForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const params = {
                nb_accounts: parseInt(document.getElementById('nb_accounts').value),
                nb_scenarios: parseInt(document.getElementById('nb_scenarios').value),
                nb_years: parseInt(document.getElementById('nb_years').value),
                nb_sc_int: parseInt(document.getElementById('nb_sc_int').value),
                nb_an_projection_int: parseInt(document.getElementById('nb_an_projection_int').value),
                choc_capital: parseFloat(document.getElementById('choc_capital').value),
                hurdle_rt: parseFloat(document.getElementById('hurdle_rt').value)
            };

            const logAccountId = document.getElementById('log_account_id').value;
            const logScenario = document.getElementById('log_scenario').value;
            const logMaxYears = document.getElementById('log_max_years').value;
            const logInternalScenario = document.getElementById('log_internal_scenario').value;

            if (logAccountId !== '') params.log_account_id = parseInt(logAccountId);
            if (logScenario !== '') params.log_scenario = parseInt(logScenario);
            if (logMaxYears !== '') params.log_max_years = parseInt(logMaxYears);
            if (logInternalScenario !== '') params.log_internal_scenario = parseInt(logInternalScenario);

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating...';

            try {
                const response = await fetch(`${API_BASE}/jobs`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(params)
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert(`Job created successfully: ${data.job_id}`, 'success');
                    refreshJobs();
                } else {
                    showAlert(`Error: ${data.error}`, 'error');
                }
            } catch (error) {
                showAlert(`Failed to create job: ${error.message}`, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Job';
            }
        });

        async function refreshJobs() {
            try {
                const response = await fetch(`${API_BASE}/jobs`);
                const data = await response.json();

                const jobsList = document.getElementById('jobsList');

                if (data.jobs && data.jobs.length > 0) {
                    jobsList.innerHTML = data.jobs.map(job => `
                        <div class="job-item">
                            <div class="job-header">
                                <span class="job-id">${job.job_id}</span>
                                <span class="job-status status-${job.status}">${job.status.toUpperCase()}</span>
                            </div>
                            <div class="job-info">
                                <div>Created: ${new Date(job.created_at).toLocaleString()}</div>
                                ${job.started_at ? `<div>Started: ${new Date(job.started_at).toLocaleString()}</div>` : ''}
                                ${job.completed_at ? `<div>Completed: ${new Date(job.completed_at).toLocaleString()}</div>` : ''}
                                ${job.error ? `<div style="color: #ef4444;">Error: ${job.error}</div>` : ''}
                            </div>
                            <div class="job-actions">
                                <button class="btn-small" onclick="viewJobDetails('${job.job_id}')">View Details</button>
                                ${job.status === 'completed' ? `
                                    <button class="btn-small" onclick="viewResults('${job.job_id}', 'summary')">Summary Results</button>
                                    <button class="btn-small" onclick="viewResults('${job.job_id}', 'detailed')">Detailed Results</button>
                                    <button class="btn-small" onclick="viewResults('${job.job_id}', 'internal')">Internal Results</button>
                                ` : ''}
                            </div>
                        </div>
                    `).join('');
                } else {
                    jobsList.innerHTML = '<div class="empty-state">No jobs found</div>';
                }
            } catch (error) {
                document.getElementById('jobsList').innerHTML =
                    '<div class="empty-state">Failed to load jobs</div>';
            }
        }

        async function viewJobDetails(jobId) {
            const modal = document.getElementById('resultsModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');
            const downloadBtn = document.getElementById('modalDownloadBtn');

            modalTitle.textContent = `Job Details: ${jobId}`;
            modalBody.innerHTML = '<div class="empty-state">Loading...</div>';
            downloadBtn.style.display = 'none';
            modal.classList.add('active');

            try {
                const response = await fetch(`${API_BASE}/jobs/${jobId}`);
                const job = await response.json();

                modalBody.innerHTML = `
                    <div style="background: #f9fafb; padding: 15px; border-radius: 8px;">
                        <strong>Parameters:</strong>
                        <pre>${JSON.stringify(job.parameters, null, 2)}</pre>
                    </div>
                `;
            } catch (error) {
                showAlert(`Failed to load job details: ${error.message}`, 'error');
                closeModal();
            }
        }

        async function viewResults(jobId, type) {
            const modal = document.getElementById('resultsModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');
            const downloadBtn = document.getElementById('modalDownloadBtn');

            modalTitle.textContent = `${type.toUpperCase()} Results: ${jobId}`;
            modalBody.innerHTML = '<div class="empty-state">Loading...</div>';
            downloadBtn.style.display = 'none';
            modal.classList.add('active');

            try {
                const response = await fetch(`${API_BASE}/jobs/${jobId}/results?type=${type}`);
                const result = await response.json();

                if (response.ok) {
                    const data = result.data;

                    if (data && data.length > 0) {
                        const columns = Object.keys(data[0]);

                        modalBody.innerHTML = `
                            <div style="margin-bottom: 15px; color: #666;">
                                <strong>Total Rows:</strong> ${data.length}
                            </div>
                            <div class="table-container">
                                <table>
                                    <thead>
                                        <tr>
                                            ${columns.map(col => `<th>${col}</th>`).join('')}
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${data.map(row => `
                                            <tr>
                                                ${columns.map(col => {
                                                    const value = row[col];
                                                    const formatted = typeof value === 'number'
                                                        ? (Number.isInteger(value) ? value : value.toFixed(4))
                                                        : value;
                                                    return `<td>${formatted}</td>`;
                                                }).join('')}
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        `;

                        downloadBtn.style.display = 'block';
                        downloadBtn.onclick = () => downloadCSV(jobId, type);
                    } else {
                        modalBody.innerHTML = '<div class="empty-state">No data available</div>';
                    }
                } else {
                    showAlert(`Error loading results: ${result.error}`, 'error');
                    closeModal();
                }
            } catch (error) {
                showAlert(`Failed to load results: ${error.message}`, 'error');
                closeModal();
            }
        }

        function closeModal() {
            const modal = document.getElementById('resultsModal');
            modal.classList.remove('active');
        }

        // Close modal when clicking outside
        document.getElementById('resultsModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // Close modal with Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        function downloadCSV(jobId, type) {
            fetch(`${API_BASE}/jobs/${jobId}/results?type=${type}`)
                .then(response => response.json())
                .then(result => {
                    const data = result.data;
                    if (!data || data.length === 0) return;

                    const columns = Object.keys(data[0]);
                    const csvContent = [
                        columns.join(','),
                        ...data.map(row => columns.map(col => row[col]).join(','))
                    ].join('\n');

                    const blob = new Blob([csvContent], { type: 'text/csv' });
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${jobId}_${type}_results.csv`;
                    a.click();
                    window.URL.revokeObjectURL(url);
                })
                .catch(error => showAlert(`Failed to download CSV: ${error.message}`, 'error'));
        }

        checkApiStatus();
        refreshJobs();
    </script>
</body>
</html>
